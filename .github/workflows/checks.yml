name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Skill structure
        run: python -X utf8 scripts/validate_skills.py
      - name: Run tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate skills CLI
        run: npx --yes skills add . --list
